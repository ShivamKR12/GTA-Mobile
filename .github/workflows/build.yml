name: Build Godot Executables

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  export_game:
    runs-on: ubuntu-latest
    name: Export Game
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Android Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Godot Export
        id: export
        uses: firebelley/godot-export@v5.2.1
        with:
          # Match the exact Godot version you are using
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true

      - name: Upload Pipeline Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Game-Executables
          path: ${{ steps.export.outputs.archive_directory }}/*
          
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        # Only publish releases on commits to main/master, not on PRs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Development Build #${{ github.run_number }}"
          body: "Automated build of the latest commit."
          files: ${{ steps.export.outputs.archive_directory }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
